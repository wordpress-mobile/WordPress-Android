// Only run build scan on CI builds.
develocity {
    if (gradle.ext.secretProperties.get('measureBuildsEnabled')?.toBoolean() ?: false) {
        buildScan {
            server = "https://develocity.a8c-ci.services/"
            accessKey = gradle.ext.secretProperties["develocityToken"]

            if (gradle.ext.isCi) {
                uploadInBackground = false
            } else {
                obfuscation {
                    hostname { "" }
                    ipAddresses { it.collect { "0.0.0.0" } }
                }
            }
        }
    } else if (gradle.ext.isCi) {
        termsOfUseUrl = 'https://gradle.com/terms-of-service'
        termsOfUseAgree = 'yes'
        uploadInBackground = false
    }
}
