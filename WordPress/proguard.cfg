###### Gson model classes - begin
# Gson creates our models reflectively and reads/writes their fields, so R8 must not remove, merge or
# make abstract any of our classes it can't see being created, or deserialization breaks in release
# builds only (ClassCastException, "Abstract classes can't be instantiated", missing fields). Keeping
# every class with its fields and no-arg constructor also covers field types nested inside a model,
# and means new Gson models need no rule of their own. The <init>() matters: without it Gson falls
# back to Unsafe.allocateInstance, which skips Kotlin field initializers, so defaulted fields come
# out null. Methods are still optimized. Same approach as woocommerce-android#16485.
-keep class org.wordpress.android.** { <fields>; <init>(); }
-keepclassmembers enum org.wordpress.android.** { *; }
###### Gson model classes - end

