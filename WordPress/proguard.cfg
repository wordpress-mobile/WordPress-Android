###### TagSoup - begin
# Android's boot classpath has its own hidden TagSoup, which shadows the copy bundled for Aztec at runtime. Keep it
# so R8 doesn't publicize and inline its members into Aztec, which then can't access the framework copy's private
# fields (IllegalAccessError on org.ccil.cowan.tagsoup.Parser.theContentHandler when opening a post).
-keep class org.ccil.cowan.tagsoup.** { *; }
###### TagSoup - end

