# yaml-language-server: $schema=https://raw.githubusercontent.com/buildkite/pipeline-schema/main/schema.json
---

# Validation only, do not merge: runs one job on the android-staging AMI from Automattic/buildkite-ci#1104.
steps:
  - label: ":android: Validate the v7 Android AMI"
    command: .buildkite/commands/validate-android-ami.sh
    plugins: [$CI_TOOLKIT]
    agents:
      queue: android-staging
